name: Test Maizuru
on:
  push:
    paths:
      - .github/workflows/test.yml
      - Maizuru/**
      - Maizuru.*/**
  pull_request:
    paths:
      - .github/workflows/test.yml
      - Maizuru/**
      - Maizuru.*/**

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore packages
        run: dotnet restore Maizuru.Test/Maizuru.Test.csproj /p:Platform=x64

      - name: Build test project
        run: dotnet build Maizuru.Test/Maizuru.Test.csproj --no-restore /p:Configuration=Debug /p:Platform=x64

      - name: Run unit tests
        run: dotnet test Maizuru.Test\bin\x64\Debug\net10.0-windows10.0.26100.0\Maizuru.Test.dll --logger "console;verbosity=normal"
